version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobseek-postgres
    environment:
      POSTGRES_USER: jobseek
      POSTGRES_PASSWORD: jobseek
      POSTGRES_DB: jobseek
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobseek -d jobseek"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobseek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
